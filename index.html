<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensor to 3D Model</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #resetButton {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 15px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      z-index: 100;
    }
    #status {
      position: absolute;
      top: 60px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 4px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <button id="resetButton">Reset Orientation</button>
  <div id="status">Connecting to sensor...</div>
  <script type="module" src="main.js"></script>
</body>
</html>
